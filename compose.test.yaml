# End-to-end tests against a real IMAP server: `bun run test:e2e`
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=alice:secret@example.com,bob:secret@example.com -Dgreenmail.users.login=email

  e2e:
    image: oven/bun:1.4
    working_dir: /app
    volumes:
      - .:/app
    environment:
      IMAP_HOST: greenmail
      IMAP_PORT: 3143
    command: bun test test/e2e.test.ts
    depends_on:
      - greenmail
